<header class="w-full bg-white border-b border-gray-200 shadow-sm">
  <div class="flex items-center justify-between px-4 py-3">
    <!-- Toggle Sidebar -->
    <button id="menu-toggle" class="text-dark hover:text-primary transition">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="w-7 h-7"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Title -->
    <h1 id="admin-title" class="text-xl font-semibold text-dark">Dashboard</h1>

    <!-- Profile -->
    <div class="w-9 h-9 rounded-full overflow-hidden border">
      <img src="/assets/img/profile.png" alt="Admin" class="w-full h-full object-cover" />
    </div>
  </div>
</header>
