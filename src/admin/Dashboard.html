<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Kopiku Admin</title>

    <link rel="stylesheet" href="../../dist/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body class="bg-background min-h-screen">
    <!-- HEADER -->
    <div id="header-container"></div>

    <div class="flex">
      <!-- SIDEBAR -->
      <div id="sidebar-wrapper"></div>

      <!-- MAIN CONTENT -->
      <main class="flex-1 p-4 md:p-6 max-w-5xl mx-auto">
        <h2 class="text-2xl font-semibold mt-6">📊 Dashboard Admin</h2>
        <p class="text-gray-500 text-sm mt-1">Ringkasan data sistem Kopiku</p>

        <!-- STATISTIK -->
        <section
          id="stats-container"
          class="grid grid-cols-2 md:grid-cols-4 gap-4 my-6"
        ></section>

        <!-- GRAFIK -->
        <section class="bg-white p-6 rounded-xl shadow">
          <h3 class="font-semibold mb-4">Grafik Penjualan</h3>
          <canvas id="incomeChart"></canvas>
        </section>
      </main>
    </div>

    <script type="module" src="./js/dashboard.js"></script>
  </body>
</html>
